<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<title>INCHANG EXTREME MAZE</title>

<style>

/* =========================================================
   기본
========================================================= */

:root {
    --blue: #00aaff;
    --blue-dark: #003b66;
    --gold: #f1c40f;
    --gold-light: #ffe680;
    --red: #ff3030;
    --bg: #02070d;
    --panel: rgba(4, 15, 27, 0.92);
}

* {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
    outline: none;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(
            circle at 50% 40%,
            #06223a 0%,
            #02070d 55%,
            #000 100%
        );

    color: white;

    font-family:
        Arial,
        "Malgun Gothic",
        sans-serif;

    display: flex;
    flex-direction: column;
}


/* =========================================================
   상단 HUD
========================================================= */

.logo-header {

    position: relative;

    height: 76px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding:
        0 22px;

    background:
        linear-gradient(
            180deg,
            rgba(0, 51, 102, 0.96),
            rgba(0, 18, 35, 0.96)
        );

    border-bottom:
        2px solid var(--gold);

    box-shadow:
        0 0 20px rgba(0, 170, 255, 0.25),
        0 4px 25px rgba(0, 0, 0, 0.7);

    z-index: 100;
}


/* 왼쪽 */

.header-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.game-title {

    font-size: 17px;

    font-weight: 900;

    letter-spacing: 2px;

    color: var(--gold);

    text-shadow:
        0 0 8px rgba(241, 196, 15, 0.7);
}

.game-subtitle {

    font-size: 10px;

    letter-spacing: 3px;

    color: #75cfff;

    opacity: 0.85;
}


/* 오른쪽 */

.header-right {

    display: flex;

    align-items: center;

    gap: 14px;
}

.stage-box {

    text-align: right;
}

.stage-label {

    display: block;

    font-size: 9px;

    color: #78cfff;

    letter-spacing: 2px;
}

#stage-display {

    font-size: 19px;

    font-weight: 900;

    color: var(--gold);

    text-shadow:
        0 0 10px rgba(241, 196, 15, 0.7);
}


/* 타이머 */

.timer-box {

    min-width: 95px;

    padding: 7px 12px;

    border:
        1px solid rgba(0, 170, 255, 0.45);

    border-radius: 8px;

    background:
        rgba(0, 0, 0, 0.35);

    text-align: center;
}

.timer-label {

    display: block;

    font-size: 8px;

    color: #75cfff;

    letter-spacing: 2px;
}

#timer-display {

    font-size: 18px;

    font-weight: 900;

    color: white;
}


/* =========================================================
   게임 영역
========================================================= */

#game-container {

    flex: 1;

    position: relative;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 12px;

    overflow: hidden;

    background:
        radial-gradient(
            circle,
            rgba(0, 80, 130, 0.15),
            transparent 65%
        );
}


/* 배경 격자 */

#game-container::before {

    content: "";

    position: absolute;

    inset: 0;

    background-image:
        linear-gradient(
            rgba(0, 170, 255, 0.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0, 170, 255, 0.035) 1px,
            transparent 1px
        );

    background-size: 35px 35px;

    pointer-events: none;
}


/* 캔버스 */

canvas {

    position: relative;

    background: #101a24;

    border:
        3px solid rgba(0, 170, 255, 0.65);

    border-radius: 12px;

    z-index: 5;

    box-shadow:
        0 0 10px rgba(0, 170, 255, 0.5),
        0 0 35px rgba(0, 100, 200, 0.25),
        0 20px 50px rgba(0, 0, 0, 0.7);

    transition:
        transform 0.15s ease;
}


/* =========================================================
   현재 모드 표시
========================================================= */

#mode-hud {

    position: absolute;

    top: 14px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    padding: 6px 16px;

    border:
        1px solid rgba(0, 170, 255, 0.45);

    border-radius: 20px;

    background:
        rgba(0, 8, 15, 0.82);

    color: #8ddcff;

    font-size: 11px;

    letter-spacing: 1px;

    box-shadow:
        0 0 15px rgba(0, 170, 255, 0.2);

    pointer-events: none;
}


/* =========================================================
   상태 메시지
========================================================= */

#status-msg {

    position: absolute;

    top: 58px;

    left: 50%;

    transform: translateX(-50%);

    width: max-content;

    max-width: 90%;

    z-index: 1000;

    padding: 10px 22px;

    border-radius: 8px;

    background:
        rgba(0, 0, 0, 0.75);

    border:
        1px solid rgba(255, 255, 255, 0.15);

    font-weight: 900;

    font-size: 17px;

    color: var(--gold);

    text-shadow:
        0 0 10px currentColor;

    pointer-events: none;

    opacity: 0;

    transition: opacity 0.2s;
}


/* =========================================================
   타임어택 게이지
========================================================= */

#timer-bar-wrapper {

    position: absolute;

    left: 50%;

    bottom: 10px;

    transform: translateX(-50%);

    width: min(500px, 70%);

    height: 5px;

    background:
        rgba(255,255,255,0.08);

    border-radius: 10px;

    overflow: hidden;

    z-index: 20;

    pointer-events: none;
}

#timer-bar {

    width: 100%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            #00aaff,
            #f1c40f
        );

    box-shadow:
        0 0 10px rgba(0,170,255,0.8);

    transition:
        width 0.1s linear;
}


/* =========================================================
   위험 테두리
========================================================= */

.red-light-border {

    position: fixed;

    inset: 0;

    border:
        10px solid var(--red);

    pointer-events: none;

    display: none;

    z-index: 1000;

    box-shadow:
        inset 0 0 80px rgba(255, 0, 0, 0.8);

    animation:
        dangerPulse 0.9s infinite alternate;
}

@keyframes dangerPulse {

    from {
        opacity: 0.35;
    }

    to {
        opacity: 1;
    }
}


/* =========================================================
   추격전 경고
========================================================= */

#danger-hud {

    position: absolute;

    top: 105px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 30;

    display: none;

    padding: 8px 20px;

    color: #ff4d4d;

    font-weight: 900;

    letter-spacing: 2px;

    border:
        1px solid rgba(255, 50, 50, 0.6);

    background:
        rgba(80, 0, 0, 0.35);

    border-radius: 8px;

    animation:
        dangerText 0.7s infinite alternate;

    pointer-events: none;
}

@keyframes dangerText {

    from {
        opacity: 0.45;
    }

    to {
        opacity: 1;
        text-shadow:
            0 0 15px red;
    }
}


/* =========================================================
   공통 오버레이
========================================================= */

.overlay {

    position: fixed;

    inset: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    background:
        radial-gradient(
            circle,
            rgba(0, 35, 65, 0.78),
            rgba(0, 0, 0, 0.97)
        );

    backdrop-filter:
        blur(5px);

    z-index: 99999;
}


/* 시작 화면 */

#start-modal {

    animation:
        overlayIn 0.6s ease;
}

@keyframes overlayIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


.start-panel {

    width: min(430px, 92%);

    padding: 30px 25px;

    background:
        linear-gradient(
            145deg,
            rgba(10, 30, 50, 0.96),
            rgba(2, 9, 16, 0.98)
        );

    border:
        1px solid rgba(0, 170, 255, 0.45);

    border-radius: 18px;

    box-shadow:
        0 0 30px rgba(0, 170, 255, 0.18),
        0 25px 70px rgba(0,0,0,0.8);
}


.start-title {

    margin: 0 0 7px;

    font-size: 30px;

    color: var(--gold);

    text-shadow:
        0 0 15px rgba(241,196,15,0.7);
}

.start-description {

    margin-bottom: 25px;

    color: #8da4b8;

    font-size: 13px;
}


/* =========================================================
   모드 선택
========================================================= */

.mode-grid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 9px;

    margin-bottom: 20px;
}

.mode-btn {

    min-height: 52px;

    padding: 10px;

    border:
        1px solid #33495c;

    border-radius: 10px;

    color: #7e91a0;

    font-size: 13px;

    font-weight: 900;

    cursor: pointer;

    background:
        linear-gradient(
            145deg,
            #182631,
            #0d151c
        );

    transition:
        0.2s;
}

.mode-btn:hover {

    border-color: #55758d;
}

.mode-btn.active {

    color: white;

    border-color: var(--gold);

    background:
        linear-gradient(
            145deg,
            #3b3418,
            #1c1b10
        );

    box-shadow:
        0 0 15px rgba(241,196,15,0.35),
        inset 0 0 15px rgba(241,196,15,0.06);
}


/* =========================================================
   시작 버튼
========================================================= */

.start-btn {

    width: 100%;

    padding: 17px;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            90deg,
            #dcae00,
            #ffe05c,
            #dcae00
        );

    color: #111;

    font-size: 20px;

    font-weight: 900;

    letter-spacing: 2px;

    cursor: pointer;

    box-shadow:
        0 0 15px rgba(241,196,15,0.55),
        0 8px 25px rgba(0,0,0,0.4);

    transition:
        transform 0.2s,
        box-shadow 0.2s;
}

.start-btn:hover {

    transform:
        translateY(-2px)
        scale(1.02);

    box-shadow:
        0 0 25px rgba(241,196,15,0.8);
}

.start-btn:active {

    transform:
        scale(0.97);
}


/* =========================================================
   스테이지 시작 연출
========================================================= */

#stage-intro {

    display: none;
}

.intro-line {

    width: 220px;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--blue),
            transparent
        );

    margin: 12px 0;
}

.intro-small {

    color: #79d4ff;

    letter-spacing: 5px;

    font-size: 12px;
}

.intro-stage {

    font-size: 64px;

    font-weight: 900;

    color: white;

    text-shadow:
        0 0 15px #00aaff,
        0 0 35px rgba(0,170,255,0.7);

    animation:
        stageZoom 0.8s ease;
}

.intro-name {

    color: var(--gold);

    font-size: 18px;

    letter-spacing: 4px;

    font-weight: 900;
}

@keyframes stageZoom {

    from {
        transform: scale(1.5);

        opacity: 0;
    }

    to {
        transform: scale(1);

        opacity: 1;
    }
}


/* =========================================================
   클리어 화면
========================================================= */

#clear-modal {

    display: none;
}

.clear-panel {

    width: min(430px, 90%);

    padding: 35px 25px;

    border:
        1px solid rgba(241,196,15,0.55);

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            rgba(35,30,8,0.97),
            rgba(5,8,12,0.98)
        );

    box-shadow:
        0 0 40px rgba(241,196,15,0.25);
}

.clear-title {

    font-size: 40px;

    font-weight: 900;

    color: var(--gold);

    text-shadow:
        0 0 20px rgba(241,196,15,0.7);
}

.clear-stage {

    margin-top: 10px;

    color: white;

    font-size: 18px;
}

.clear-message {

    margin-top: 25px;

    color: #8ca3b5;

    font-size: 13px;
}


/* =========================================================
   조작 영역
========================================================= */

#controls-wrapper {

    position: relative;

    flex-shrink: 0;

    min-height: 205px;

    padding:
        15px 0 35px;

    background:
        linear-gradient(
            180deg,
            rgba(5,18,30,0.98),
            rgba(1,5,9,1)
        );

    border-top:
        1px solid rgba(0,170,255,0.5);

    box-shadow:
        0 -10px 30px rgba(0,0,0,0.45);

    z-index: 50;
}

.controls-label {

    position: absolute;

    top: 7px;

    left: 50%;

    transform: translateX(-50%);

    color: #4f7085;

    font-size: 9px;

    letter-spacing: 3px;
}

#controls {

    display: grid;

    grid-template-areas:
        ". up ."
        "left center right"
        ". down .";

    gap: 8px;

    justify-content: center;

    align-items: center;

    margin-top: 12px;
}

.btn {

    width: 64px;

    height: 64px;

    border-radius: 18px;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 27px;

    color: white;

    border:
        1px solid rgba(90,160,200,0.45);

    background:
        linear-gradient(
            145deg,
            #183247,
            #0c1822
        );

    box-shadow:
        0 5px 12px rgba(0,0,0,0.5),
        inset 0 0 10px rgba(0,170,255,0.05);

    transition:
        transform 0.08s,
        background 0.08s;
}

.btn:active {

    transform:
        scale(0.9);

    background:
        linear-gradient(
            145deg,
            #285c7c,
            #123247
        );

    box-shadow:
        0 0 15px rgba(0,170,255,0.5);
}

.center-btn {

    grid-area: center;

    width: 48px;

    height: 48px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #f1c40f,
            #755f00
        );

    box-shadow:
        0 0 15px rgba(241,196,15,0.35);

    pointer-events: none;
}


/* =========================================================
   모바일
========================================================= */

@media (max-width: 700px) {

    .logo-header {

        height: 65px;

        padding:
            0 12px;
    }

    .game-title {

        font-size: 13px;

        letter-spacing: 1px;
    }

    .game-subtitle {

        font-size: 7px;

        letter-spacing: 2px;
    }

    #stage-display {

        font-size: 15px;
    }

    .timer-box {

        min-width: 75px;

        padding: 5px 8px;
    }

    #timer-display {

        font-size: 15px;
    }

    #mode-hud {

        top: 8px;

        font-size: 9px;

        padding:
            5px 10px;
    }

    #danger-hud {

        top: 45px;

        font-size: 11px;
    }

    #controls-wrapper {

        min-height: 190px;

        padding-bottom: 25px;
    }

    .btn {

        width: 58px;

        height: 58px;

        font-size: 24px;
    }

    .center-btn {

        width: 42px;

        height: 42px;
    }

    .intro-stage {

        font-size: 50px;
    }

    .start-title {

        font-size: 25px;
    }
}


/* =========================================================
   작은 휴대폰
========================================================= */

@media (max-height: 700px) {

    #controls-wrapper {

        min-height: 160px;

        padding-top: 10px;
    }

    .btn {

        width: 52px;

        height: 52px;
    }

    .center-btn {

        width: 38px;

        height: 38px;
    }
}

</style>
</head>


<body>


<!-- =======================================================
     위험 테두리
======================================================= -->

<div
    class="red-light-border"
    id="red-light-ui">
</div>


<!-- =======================================================
     상단 HUD
======================================================= -->

<header class="logo-header">

    <div class="header-left">

        <div class="game-title">
            INCHANG EXTREME
        </div>

        <div class="game-subtitle">
            SURVIVAL MAZE SYSTEM
        </div>

    </div>


    <div class="header-right">

        <div class="stage-box">

            <span class="stage-label">
                STAGE
            </span>

            <span id="stage-display">
                01 / 13
            </span>

        </div>


        <div class="timer-box">

            <span class="timer-label">
                TIME
            </span>

            <span id="timer-display">
                --:--
            </span>

        </div>

    </div>

</header>


<!-- =======================================================
     게임 영역
======================================================= -->

<div id="game-container">

    <canvas
        id="mazeCanvas"
        tabindex="0">
    </canvas>


    <div id="mode-hud">
        MODE : NORMAL
    </div>


    <div id="status-msg">
    </div>


    <div id="danger-hud">
        ⚠ DANGER — PURSUER DETECTED
    </div>


    <div id="timer-bar-wrapper">

        <div id="timer-bar"></div>

    </div>


    <!-- ===================================================
         시작 화면
    =================================================== -->

    <div
        id="start-modal"
        class="overlay">

        <div class="start-panel">

            <h1 class="start-title">
                인창고 생존 미로
            </h1>

            <p class="start-description">
                원하는 게임 모드를 선택하고<br>
                EXTREME MAZE에 도전하세요.
            </p>


            <div class="mode-grid">

                <div
                    class="mode-btn"
                    id="m-fog"
                    onclick="toggleMode('fog')">

                    🌫️ 연한 안개 모드

                </div>


                <div
                    class="mode-btn"
                    id="m-chase"
                    onclick="toggleMode('chase')">

                    👺 추격전

                </div>


                <div
                    class="mode-btn"
                    id="m-chaos"
                    onclick="toggleMode('chaos')">

                    🌀 카오스

                </div>


                <div
                    class="mode-btn"
                    id="m-time"
                    onclick="toggleMode('time')">

                    ⏳ 타임어택

                </div>


                <div
                    class="mode-btn"
                    id="m-redlight"
                    onclick="toggleMode('redlight')">

                    🚦 무궁화

                </div>

            </div>


            <button
                class="start-btn"
                onclick="applyAndStart()">

                GAME START

            </button>

        </div>

    </div>


    <!-- ===================================================
         스테이지 시작 연출
    =================================================== -->

    <div
        id="stage-intro"
        class="overlay">

        <div class="intro-small">
            INCHANG EXTREME
        </div>

        <div class="intro-line"></div>

        <div
            class="intro-stage"
            id="intro-stage-number">

            STAGE 01

        </div>

        <div
            class="intro-name"
            id="intro-stage-name">

            THE BEGINNING

        </div>

        <div class="intro-line"></div>

    </div>


    <!-- ===================================================
         클리어 화면
    =================================================== -->

    <div
        id="clear-modal"
        class="overlay">

        <div class="clear-panel">

            <div class="clear-title">
                STAGE CLEAR
            </div>

            <div
                class="clear-stage"
                id="clear-stage">

                STAGE 01 COMPLETE

            </div>

            <div class="clear-message">
                다음 스테이지를 준비하세요...
            </div>

        </div>

    </div>

</div>


<!-- =======================================================
     조작
======================================================= -->

<div id="controls-wrapper">

    <div class="controls-label">
        TOUCH CONTROL
    </div>


    <div id="controls">

        <div
            class="btn"
            style="grid-area: up;"
            onpointerdown="activeMoves.up=true"
            onpointerup="activeMoves.up=false"
            onpointercancel="activeMoves.up=false">

            ↑

        </div>


        <div
            class="btn"
            style="grid-area: left;"
            onpointerdown="activeMoves.left=true"
            onpointerup="activeMoves.left=false"
            onpointercancel="activeMoves.left=false">

            ←

        </div>


        <div class="center-btn">
        </div>


        <div
            class="btn"
            style="grid-area: right;"
            onpointerdown="activeMoves.right=true"
            onpointerup="activeMoves.right=false"
            onpointercancel="activeMoves.right=false">

            →

        </div>


        <div
            class="btn"
            style="grid-area: down;"
            onpointerdown="activeMoves.down=true"
            onpointerup="activeMoves.down=false"
            onpointercancel="activeMoves.down=false">

            ↓

        </div>

    </div>

</div>


<script>

/* =========================================================
   기본 변수
========================================================= */

const canvas =
    document.getElementById('mazeCanvas');

const ctx =
    canvas.getContext('2d');


const stages = [
    {s:15},
    {s:19},
    {s:23},
    {s:27},
    {s:31},
    {s:37},
    {s:43},
    {s:49},
    {s:55},
    {s:63},
    {s:71},
    {s:75},
    {s:79}
];


let curIdx = 0;

let maze;

let gSize;

let cSize;

let player;

let isStarted = false;

let gameTime = 30;

let selectedModes = new Set();

let items = [];

let afterimages = [];

let playerPath = [];

let activeMoves = {
    up:false,
    down:false,
    left:false,
    right:false
};

let isRedLight = false;

let chaser = {
    x:1,
    y:1
};

let chaosTick = 8;


/* =========================================================
   BGM
========================================================= */

const bgmList = [

    new Audio('bgm1.mp3'),

    new Audio('bgm2.mp3'),

    new Audio('bgm3.mp3')

];


const effectSound =
    new Audio('effect.mp3');


bgmList.forEach(track => {

    track.loop = true;

});


let currentBgm = null;


/* =========================================================
   스테이지 이름
========================================================= */

const stageNames = [

    "THE BEGINNING",

    "FIRST TRIAL",

    "THE MAZE",

    "DEEP ROUTE",

    "DARK PATH",

    "LOST AREA",

    "THE LABYRINTH",

    "CHAOS ZONE",

    "DANGER ZONE",

    "NIGHTMARE",

    "EXTREME",

    "FINAL TRIAL",

    "INCHANG EXTREME"

];


/* =========================================================
   모드 이름
========================================================= */

const modeNames = {

    fog: "🌫️ FOG MODE",

    chase: "👺 CHASE MODE",

    chaos: "🌀 CHAOS MODE",

    time: "⏳ TIME ATTACK",

    redlight: "🚦 RED LIGHT"

};


/* =========================================================
   BGM 변경
========================================================= */

function updateStageBgm() {

    if(currentBgm) {

        currentBgm.pause();

        currentBgm.currentTime = 0;

    }


    const bgmIndex =
        curIdx % bgmList.length;


    currentBgm =
        bgmList[bgmIndex];


    if(currentBgm) {

        currentBgm.play().catch(
            e => console.log(
                "BGM 재생 대기:",
                e
            )
        );

    }

}


/* =========================================================
   모드 토글
========================================================= */

function toggleMode(mode) {

    const btn =
        document.getElementById(
            'm-' + mode
        );


    if(selectedModes.has(mode)) {

        selectedModes.delete(mode);

        btn.classList.remove('active');

    }

    else {

        selectedModes.add(mode);

        btn.classList.add('active');

    }

}


/* =========================================================
   선택 모드 HUD
========================================================= */

function updateModeHud() {

    const hud =
        document.getElementById(
            'mode-hud'
        );


    if(selectedModes.size === 0) {

        hud.innerText =
            "MODE : NORMAL";

        return;

    }


    const names = [];


    selectedModes.forEach(mode => {

        names.push(
            modeNames[mode]
        );

    });


    hud.innerText =
        names.join("  •  ");

}


/* =========================================================
   게임 시작
========================================================= */

function applyAndStart() {

    document.getElementById(
        'start-modal'
    ).style.display = 'none';


    updateModeHud();


    canvas.focus();


    updateStageBgm();


    init();


    showStageIntro();


    requestAnimationFrame(
        renderLoop
    );


    setInterval(
        processInput,
        60
    );


    if(
        selectedModes.has(
            'redlight'
        )
    ) {

        setInterval(
            toggleRedLight,
            3000
        );

    }


    if(
        selectedModes.has(
            'time'
        )
    ) {

        setInterval(() => {

            if(isStarted) {

                gameTime -= 0.1;

            }

        }, 100);

    }


    if(
        selectedModes.has(
            'chase'
        )
    ) {

        setInterval(
            updateChaser,
            200
        );

    }


    if(
        selectedModes.has(
            'chaos'
        )
    ) {

        setInterval(() => {

            if(isStarted) {

                chaosTick--;

                if(
                    chaosTick <= 0
                ) {

                    teleport();

                    chaosTick = 8;

                }

            }

        }, 1000);

    }

}


/* =========================================================
   스테이지 시작 연출
========================================================= */

function showStageIntro() {

    const overlay =
        document.getElementById(
            'stage-intro'
        );


    document.getElementById(
        'intro-stage-number'
    ).innerText =
        `STAGE ${String(curIdx + 1).padStart(2,'0')}`;


    document.getElementById(
        'intro-stage-name'
    ).innerText =
        stageNames[curIdx];


    overlay.style.display =
        'flex';


    setTimeout(() => {

        overlay.style.display =
            'none';

    }, 1300);

}


/* =========================================================
   미로 초기화
========================================================= */

function init() {

    const stage =
        stages[curIdx];


    gSize =
        stage.s;


    document.getElementById(
        'stage-display'
    ).innerText =
        `${String(curIdx + 1).padStart(2,'0')} / ${stages.length}`;


    const container =
        document.getElementById(
            'game-container'
        );


    const size =
        Math.min(
            container.clientWidth - 20,
            container.clientHeight - 20
        );


    canvas.width =
        size;

    canvas.height =
        size;


    cSize =
        size / gSize;


    maze =
        makeMaze(gSize);


    player = {
        x:1,
        y:1
    };


    playerPath = [
        {
            x:1,
            y:1
        }
    ];


    items =
        selectedModes.has('time')
        ?
        Array.from(
            {length:6},
            () => findEmpty()
        )
        :
        [];


    gameTime =
        30 + (curIdx * 5);


    chaosTick = 8;


    isRedLight = false;


    document.getElementById(
        'red-light-ui'
    ).style.display =
        'none';


    document.getElementById(
        'danger-hud'
    ).style.display =
        selectedModes.has('chase')
        ? 'block'
        : 'none';

}


/* =========================================================
   빈 공간 찾기
========================================================= */

function findEmpty() {

    let rx, ry;


    do {

        rx =
            Math.floor(
                Math.random() * gSize
            );

        ry =
            Math.floor(
                Math.random() * gSize
            );

    }

    while(
        maze[ry][rx] !== 0
    );


    return {
        x:rx,
        y:ry
    };

}


/* =========================================================
   카오스 순간이동
========================================================= */

function teleport() {

    player =
        findEmpty();


    playerPath = [
        player
    ];


    canvas.style.transform =
        "scale(1.04)";


    setTimeout(() => {

        canvas.style.transform =
            "scale(1)";

    }, 150);

}


/* =========================================================
   미로 생성
========================================================= */

function makeMaze(size) {

    let m =
        Array.from(
            {length:size},
            () => Array(size).fill(1)
        );


    function walk(x,y) {

        m[y][x] = 0;


        let d = [
            [0,1],
            [0,-1],
            [1,0],
            [-1,0]
        ].sort(
            () => Math.random() - 0.5
        );


        for(
            let [dx,dy] of d
        ) {

            let nx =
                x + dx * 2;

            let ny =
                y + dy * 2;


            if(
                nx > 0 &&
                nx < size - 1 &&
                ny > 0 &&
                ny < size - 1 &&
                m[ny][nx] === 1
            ) {

                m[y + dy][x + dx] = 0;

                walk(nx,ny);

            }

        }

    }


    walk(1,1);


    m[size - 2][size - 2] = 0;


    return m;

}


/* =========================================================
   무궁화
========================================================= */

function toggleRedLight() {

    isRedLight =
        !isRedLight;


    const border =
        document.getElementById(
            'red-light-ui'
        );


    const status =
        document.getElementById(
            'status-msg'
        );


    border.style.display =
        isRedLight
        ? 'block'
        : 'none';


    if(isRedLight) {

        status.innerText =
            "🔴 RED LIGHT — STOP";

        status.style.color =
            "#ff4040";

        status.style.opacity =
            "1";

    }

    else {

        status.innerText =
            "🟢 GREEN LIGHT — RUN";

        status.style.color =
            "#4dff88";

        status.style.opacity =
            "1";


        setTimeout(() => {

            status.style.opacity =
                "0";

        }, 800);

    }

}


/* =========================================================
   추격자
========================================================= */

function updateChaser() {

    if(
        !isStarted ||
        !selectedModes.has('chase')
    ) return;


    if(
        playerPath.length > 8
    ) {

        let next =
            playerPath.shift();


        chaser.x =
            next.x;

        chaser.y =
            next.y;

    }


    if(
        chaser.x === player.x &&
        chaser.y === player.y
    ) {

        showGameOver(
            "👺 PURSUER CAUGHT YOU"
        );

    }

}


/* =========================================================
   입력 처리
========================================================= */

function processInput() {

    if(activeMoves.up)
        move('up');

    else if(activeMoves.down)
        move('down');

    else if(activeMoves.left)
        move('left');

    else if(activeMoves.right)
        move('right');

}


/* =========================================================
   이동
========================================================= */

function move(dir) {

    if(!isStarted)
        isStarted = true;


    if(
        selectedModes.has('redlight') &&
        isRedLight
    ) {

        player.x = 1;

        player.y = 1;

        return;

    }


    let dx = 0;

    let dy = 0;


    if(dir === 'up')
        dy = -1;

    if(dir === 'down')
        dy = 1;

    if(dir === 'left')
        dx = -1;

    if(dir === 'right')
        dx = 1;


    let nx =
        player.x + dx;

    let ny =
        player.y + dy;


    if(
        nx >= 0 &&
        nx < gSize &&
        ny >= 0 &&
        ny < gSize &&
        maze[ny][nx] === 0
    ) {

        afterimages.push({

            x:player.x,

            y:player.y,

            a:0.5

        });


        player.x =
            nx;

        player.y =
            ny;


        playerPath.push({

            x:nx,

            y:ny

        });


        items =
            items.filter(
                it =>
                    it.x !== player.x ||
                    it.y !== player.y
            );

    }


    if(
        player.x === gSize - 2 &&
        player.y === gSize - 2
    ) {

        checkClear();

    }

}


/* =========================================================
   게임 오버
========================================================= */

function showGameOver(message) {

    isStarted = false;


    const status =
        document.getElementById(
            'status-msg'
        );


    status.innerText =
        message;


    status.style.color =
        "#ff4040";


    status.style.opacity =
        "1";


    setTimeout(() => {

        location.reload();

    }, 1400);

}


/* =========================================================
   렌더링
========================================================= */

function renderLoop() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* 타이머 */

    if(
        selectedModes.has('time')
    ) {

        document.getElementById(
            'timer-display'
        ).innerText =
            gameTime.toFixed(2);


        const maxTime =
            30 + (curIdx * 5);


        const percent =
            Math.max(
                0,
                Math.min(
                    100,
                    (gameTime / maxTime) * 100
                )
            );


        document.getElementById(
            'timer-bar'
        ).style.width =
            percent + "%";


        if(
            gameTime <= 10 &&
            gameTime > 0
        ) {

            document.getElementById(
                'timer-display'
            ).style.color =
                "#ff4040";

        }

        else {

            document.getElementById(
                'timer-display'
            ).style.color =
                "white";

        }


        if(gameTime <= 0) {

            showGameOver(
                "⏰ TIME OVER"
            );

            return;

        }

    }

    else {

        document.getElementById(
            'timer-display'
        ).innerText =
            "--:--";

        document.getElementById(
            'timer-bar'
        ).style.width =
            "100%";

    }


    /* 미로 */

    for(
        let y = 0;
        y < gSize;
        y++
    ) {

        for(
            let x = 0;
            x < gSize;
            x++
        ) {

            if(
                maze[y][x] === 1
            ) {

                ctx.fillStyle =
                    "#172b3b";

            }

            else {

                ctx.fillStyle =
                    "#f4f8fb";

            }


            /* 출구 */

            if(
                x === gSize - 2 &&
                y === gSize - 2
            ) {

                ctx.fillStyle =
                    "#ff3030";

            }


            ctx.fillRect(
                x * cSize,
                y * cSize,
                cSize + 0.3,
                cSize + 0.3
            );

        }

    }


    /* 벽 네온 */

    ctx.strokeStyle =
        "rgba(0,170,255,0.12)";

    ctx.lineWidth = 1;


    for(
        let y = 0;
        y < gSize;
        y++
    ) {

        for(
            let x = 0;
            x < gSize;
            x++
        ) {

            if(
                maze[y][x] === 1
            ) {

                ctx.strokeRect(
                    x * cSize,
                    y * cSize,
                    cSize,
                    cSize
                );

            }

        }

    }


    /* 출구 빛 */

    const exitX =
        (gSize - 2) * cSize +
        cSize / 2;

    const exitY =
        (gSize - 2) * cSize +
        cSize / 2;


    const exitGlow =
        ctx.createRadialGradient(
            exitX,
            exitY,
            0,
            exitX,
            exitY,
            cSize * 2.5
        );


    exitGlow.addColorStop(
        0,
        "rgba(255,50,50,0.55)"
    );

    exitGlow.addColorStop(
        1,
        "rgba(255,50,50,0)"
    );


    ctx.fillStyle =
        exitGlow;


    ctx.beginPath();

    ctx.arc(
        exitX,
        exitY,
        cSize * 2.5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* 잔상 */

    afterimages =
        afterimages.filter(
            img => img.a > 0.05
        );


    afterimages.forEach(img => {

        ctx.fillStyle =
            `rgba(0,170,255,${img.a})`;


        ctx.beginPath();


        ctx.arc(
            img.x * cSize + cSize / 2,
            img.y * cSize + cSize / 2,
            cSize / 3,
            0,
            Math.PI * 2
        );


        ctx.fill();


        img.a -= 0.08;

    });


    /* 아이템 */

    items.forEach(it => {

        const ix =
            it.x * cSize +
            cSize / 2;

        const iy =
            it.y * cSize +
            cSize / 2;


        const glow =
            ctx.createRadialGradient(
                ix,
                iy,
                0,
                ix,
                iy,
                cSize
            );


        glow.addColorStop(
            0,
            "rgba(255,220,50,0.9)"
        );

        glow.addColorStop(
            1,
            "rgba(255,220,50,0)"
        );


        ctx.fillStyle =
            glow;


        ctx.beginPath();

        ctx.arc(
            ix,
            iy,
            cSize,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.fillStyle =
            "#f1c40f";


        ctx.beginPath();

        ctx.arc(
            ix,
            iy,
            cSize / 3,
            0,
            Math.PI * 2
        );

        ctx.fill();

    });


    /* 추격자 */

    if(
        selectedModes.has('chase')
    ) {

        const cx =
            chaser.x * cSize;

        const cy =
            chaser.y * cSize;


        ctx.shadowColor =
            "#ff2020";

        ctx.shadowBlur =
            15;


        ctx.fillStyle =
            "#ff2020";


        ctx.fillRect(
            cx,
            cy,
            cSize,
            cSize
        );


        ctx.shadowBlur = 0;

    }


    /* 플레이어 */

    const px =
        player.x * cSize +
        cSize / 2;

    const py =
        player.y * cSize +
        cSize / 2;


    const playerGlow =
        ctx.createRadialGradient(
            px,
            py,
            0,
            px,
            py,
            cSize * 1.8
        );


    playerGlow.addColorStop(
        0,
        "rgba(0,170,255,0.8)"
    );

    playerGlow.addColorStop(
        1,
        "rgba(0,100,255,0)"
    );


    ctx.fillStyle =
        playerGlow;


    ctx.beginPath();

    ctx.arc(
        px,
        py,
        cSize * 1.8,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.shadowColor =
        "#008cff";

    ctx.shadowBlur =
        15;


    ctx.fillStyle =
        "#0077ff";


    ctx.beginPath();

    ctx.arc(
        px,
        py,
        cSize / 2.2,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.shadowBlur = 0;


    /* 안개 */

    if(
        selectedModes.has('fog')
    ) {

        const pX =
            player.x * cSize +
            cSize / 2;

        const pY =
            player.y * cSize +
            cSize / 2;


        ctx.fillStyle =
            "rgba(0,0,0,0.72)";


        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.globalCompositeOperation =
            'destination-out';


        const viewRadius =
            cSize * 5.5;


        const grad =
            ctx.createRadialGradient(
                pX,
                pY,
                0,
                pX,
                pY,
                viewRadius
            );


        grad.addColorStop(
            0,
            'rgba(0,0,0,1)'
        );

        grad.addColorStop(
            0.7,
            'rgba(0,0,0,0.8)'
        );

        grad.addColorStop(
            1,
            'rgba(0,0,0,0)'
        );


        ctx.fillStyle =
            grad;


        ctx.beginPath();

        ctx.arc(
            pX,
            pY,
            viewRadius,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.globalCompositeOperation =
            'source-over';

    }


    requestAnimationFrame(
        renderLoop
    );

}


/* =========================================================
   스테이지 클리어
========================================================= */

function checkClear() {

    isStarted = false;


    activeMoves = {
        up:false,
        down:false,
        left:false,
        right:false
    };


    effectSound.currentTime = 0;


    effectSound.play().catch(
        e => console.log(
            "효과음:",
            e
        )
    );


    const clearModal =
        document.getElementById(
            'clear-modal'
        );


    document.getElementById(
        'clear-stage'
    ).innerText =
        `STAGE ${String(curIdx + 1).padStart(2,'0')} COMPLETE`;


    clearModal.style.display =
        'flex';


    setTimeout(() => {

        if(
            curIdx <
            stages.length - 1
        ) {

            curIdx++;


            clearModal.style.display =
                'none';


            init();


            updateStageBgm();


            showStageIntro();

        }

        else {

            showFinalClear();

        }

    }, 1800);

}


/* =========================================================
   최종 클리어
========================================================= */

function showFinalClear() {

    const clearModal =
        document.getElementById(
            'clear-modal'
        );


    clearModal.innerHTML = `

        <div class="clear-panel">

            <div class="clear-title">
                🏆 EXTREME CLEAR
            </div>

            <div class="clear-stage">
                ALL 13 STAGES COMPLETE
            </div>

            <div class="clear-message">
                인창고 익스트림 미로를 정복했습니다.
            </div>

        </div>

    `;


    clearModal.style.display =
        'flex';


    setTimeout(() => {

        location.reload();

    }, 4000);

}


/* =========================================================
   키보드
========================================================= */

const keyHandler =
    (e) => {

        const key =
            e.key.toLowerCase();


        const isDown =
            e.type === 'keydown';


        if(
            [
                'w',
                'a',
                's',
                'd',
                'arrowup',
                'arrowdown',
                'arrowleft',
                'arrowright'
            ].includes(key)
        ) {

            e.preventDefault();


            if(
                key === 'w' ||
                key === 'arrowup'
            )
                activeMoves.up =
                    isDown;


            if(
                key === 's' ||
                key === 'arrowdown'
            )
                activeMoves.down =
                    isDown;


            if(
                key === 'a' ||
                key === 'arrowleft'
            )
                activeMoves.left =
                    isDown;


            if(
                key === 'd' ||
                key === 'arrowright'
            )
                activeMoves.right =
                    isDown;

        }

    };


window.addEventListener(
    'keydown',
    keyHandler
);


window.addEventListener(
    'keyup',
    keyHandler
);


/* =========================================================
   화면 크기 변경
========================================================= */

window.addEventListener(
    'resize',
    () => {

        if(
            maze &&
            isStarted
        ) {

            const oldPlayer =
                {...player};


            init();


            player =
                oldPlayer;

        }

    }
);

</script>
